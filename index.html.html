<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ถึงดวงดาวของฉัน ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --space:#07041a; --violet:#7c4dff; --pink:#ff6ec7; --blue:#4cc9f0; --text:#f1e9ff; --muted:#b9a9e6;
  --card:rgba(24,14,60,.72); --line:rgba(190,160,255,.35);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;height:100%;overflow:hidden;background:var(--space);color:var(--text);
  font-family:'Mali','Sarabun',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;
}
/* nebula */
.nebula{position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(40vmax 40vmax at 15% 20%,rgba(124,77,255,.35),transparent 70%),
    radial-gradient(45vmax 45vmax at 85% 75%,rgba(255,110,199,.28),transparent 70%),
    radial-gradient(35vmax 35vmax at 70% 15%,rgba(76,201,240,.22),transparent 70%);
  animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{opacity:.65;filter:hue-rotate(25deg)}}
canvas#sky{position:fixed;inset:0;width:100%;height:100%}

.scene{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;z-index:2}
.hide{display:none!important}
.fade{animation:fade .9s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* intro */
.moon{width:clamp(70px,20vw,110px);aspect-ratio:1;border-radius:50%;margin:0 auto 22px;
  background:radial-gradient(circle at 35% 30%,#fff,#e5d8ff 40%,#8f6bff 100%);
  box-shadow:0 0 40px 10px rgba(167,139,255,.55),0 0 120px 30px rgba(255,110,199,.25);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
h1{margin:0 0 10px;font-size:clamp(1.7rem,7vw,3rem);line-height:1.3;
  background:linear-gradient(90deg,var(--blue),var(--pink),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0 0 26px;color:var(--muted);font-size:clamp(1rem,3.6vw,1.35rem)}
.btn{font:inherit;font-weight:700;font-size:clamp(1rem,3.8vw,1.25rem);border:0;border-radius:999px;padding:14px 32px;
  cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;color:#fff}
.go{background:linear-gradient(135deg,var(--violet),var(--pink));box-shadow:0 0 28px rgba(255,110,199,.55)}
.go:active,.yes:active{transform:scale(.95)}

/* story lines */
.line{max-width:min(86vw,640px);font-size:clamp(1.3rem,5.6vw,2.4rem);line-height:1.5;text-shadow:0 0 20px rgba(167,139,255,.9);
  animation:line 3.2s ease both}
@keyframes line{0%{opacity:0;filter:blur(8px)}20%,80%{opacity:1;filter:none}100%{opacity:0;filter:blur(6px)}}

/* card */
.card{width:min(90vw,460px);background:var(--card);border:1px solid var(--line);border-radius:28px;
  padding:clamp(24px,5vw,38px) clamp(18px,5vw,32px);box-shadow:0 0 60px rgba(124,77,255,.45),inset 0 0 30px rgba(255,255,255,.04)}
@media (min-width:700px){.card{width:min(66vw,560px)}}

/* กำหนดขนาดรูปภาพและแอนิเมชันลอยตัว */
.emoji {
  width: 120px;
  height: 120px;
  object-fit: cover;
  border-radius: 50%; /* ทำให้รูปเป็นวงกลม (ถ้าต้องการสี่เหลี่ยมขอบมนปกติ ให้ลบบรรทัดนี้ออก) */
  margin: 0 auto 15px auto;
  display: block;
  animation: float 3s ease-in-out infinite;
}

.card p{margin:0 0 22px;color:var(--muted);font-size:clamp(.98rem,3.5vw,1.25rem);line-height:1.7}
.btns{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:56px}
.yes{background:linear-gradient(135deg,var(--pink),var(--violet));box-shadow:0 0 26px rgba(255,110,199,.6);transition:transform .15s}
.no{background:rgba(255,255,255,.12);border:1px solid var(--line);color:var(--text);z-index:20;transition:left .25s ease,top .25s ease}
.no.fleeing{position:fixed}

/* ดีไซน์ปุ่มควบคุมเพลง (มุมขวาบน ธีมอวกาศ) */
.music-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 100;
    background: rgba(24, 14, 60, 0.85);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 8px 18px;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border-radius: 50px;
    cursor: pointer;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 20px rgba(124, 77, 255, 0.4);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s ease;
}
.music-toggle:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 25px rgba(255, 110, 199, 0.6);
}
.sound-wave {
    display: none;
    gap: 3px;
    align-items: flex-end;
    height: 12px;
    margin-left: 4px;
}
.sound-wave span {
    display: block;
    width: 3px;
    background: var(--pink);
    animation: bounce 0.6s infinite alternate;
}
.sound-wave span:nth-child(2) { animation-delay: 0.2s; }
.sound-wave span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
    0% { height: 3px; }
    100% { height: 12px; }
}
.playing .sound-wave {
    display: flex;
}
</style>
</head>
<body>
<div class="nebula"></div>
<canvas id="sky"></canvas>

<!-- ปุ่มควบคุมเพลง (มุมขวาบน) -->
<button id="musicToggleBtn" class="music-toggle">
    <span id="btnText">🎵 เปิดเพลง</span>
    <div class="sound-wave">
        <span></span>
        <span></span>
        <span></span>
    </div>
</button>

<!-- แท็กเสียงพื้นหลัง -->
<audio id="bgMusic" loop>
    <source src="รู้งี้เป็นแฟนกันตั้งนานแล้ว.mp3" type="audio/mpeg">
    เบราว์เซอร์ของคุณไม่รองรับการเล่นไฟล์เสียง
</audio>

<section class="scene" id="intro">
  <div class="fade">
    <h1>มีข้อความจากเค้าเอง 💖</h1>
    <p class="sub">ส่งตรงจากดาวนาเมกถึงเธอคนเดียว ✨</p>
    <button class="btn go" id="start">จิ้มเพื่อบินไปกับเค้า 🚀</button>
  </div>
</section>

<section class="scene hide" id="story"><div class="line" id="line"></div></section>

<section class="scene hide" id="ask">
  <div class="card fade" id="card">
    <!-- เปลี่ยนเป็นรูปภาพตามต้องการ -->
    <img src="pls.jpg" alt="รูปภาพ" class="emoji" id="emoji">
    <h1 id="title">เป็นแฟนกับเค้าม้าย?</h1>
    <p id="text">ไอเลิฟยูว ยูวก็รู้อยู่ว่ารัก<br>ตอบว่า "เป็นเถอะน้าพลีส" 🌟</p>
    <div class="btns" id="btns">
      <button class="btn yes" id="yes">เป็น 💖</button>
      <button class="btn no" id="no">ไม่เป็น</button>
    </div>
  </div>
</section>

<script>
/* ===== ระบบควบคุมเสียงเพลง ===== */
const music = document.getElementById('bgMusic');
const btn = document.getElementById('musicToggleBtn');
const btnText = document.getElementById('btnText');

music.volume = 0.4; // ระดับเสียง (0.0 ถึง 1.0)

btn.addEventListener('click', () => {
    if (music.paused) {
        music.play().then(() => {
            btnText.textContent = '🔊 ปิดเพลง';
            btn.classList.add('playing');
        }).catch(error => {
            console.log("การเล่นเพลงถูกบล็อก:", error);
        });
    } else {
        music.pause();
        btnText.textContent = '🎵 เปิดเพลง';
        btn.classList.remove('playing');
    }
});

/* ===== ปรับข้อความได้ที่นี่ ===== */
const LINES = [
  "ในจักรวาลนี้…",
  "เค้าอยากมีเธอ ✨",
  "เป็นคนที่อยู่กับเค้าไปตลอดเลยนะ 💖",
];
const YES = {
  image:"pls2.jpg", // รูปภาพที่จะเปลี่ยนเมื่อกดปุ่ม "เป็น" (ถ้าต้องการ)
  title:"โห้ยย",
  text:"เค้าจะรักเธอทุกวัน<br>เค้าจะถนอมใจเธออย่างดีเลยนะ<br>อยู่ด้วยกันไปนานๆๆ นานมากๆเลยนะ 💜"
};

/* ===== ท้องฟ้าดาว + กาแล็กซี ===== */
const cv = document.getElementById('sky'), ctx = cv.getContext('2d');
let W=0,H=0,dpr=1,stars=[],gal=[],shoots=[],bursts=[],boost=0,px=0,py=0,t=0,nextShoot=60;
const PAL=['#ffffff','#cfe3ff','#ffd6f3','#d9c8ff','#aee8ff'];

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  stars=Array.from({length:Math.min(420,(W*H/3200)|0)},()=>({
    x:Math.random()*W,y:Math.random()*H,z:.2+Math.random()*.8,r:Math.random()*1.4+.3,
    p:Math.random()*6.28,c:PAL[(Math.random()*PAL.length)|0]}));
  const R=Math.max(W,H)*.5, arms=3;
  gal=Array.from({length:900},()=>{
    const d=Math.pow(Math.random(),1.6)*R, a=(Math.random()*arms|0)*(6.283/arms)+d*.011+(Math.random()-.5)*.55;
    return {d,a,r:Math.random()*1.3+.3,h:d/R};
  });
}
resize(); addEventListener('resize',resize);
addEventListener('pointermove',e=>{px=(e.clientX/W-.5);py=(e.clientY/H-.5)});

function draw(){
  t+=1; ctx.clearRect(0,0,W,H);
  // กาแล็กซีหมุนช้าๆ
  const cx=W/2+px*-30, cy=H/2+py*-30, tilt=-.35;
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(tilt); ctx.scale(1,.5);
  const g=ctx.createRadialGradient(0,0,0,0,0,Math.max(W,H)*.22);
  g.addColorStop(0,'rgba(255,230,255,.55)'); g.addColorStop(.4,'rgba(190,120,255,.22)'); g.addColorStop(1,'rgba(124,77,255,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,Math.max(W,H)*.25,0,6.283); ctx.fill();
  const rot=t*.0006*(1+boost*6);
  for(const s of gal){
    const a=s.a+rot, x=Math.cos(a)*s.d, y=Math.sin(a)*s.d;
    ctx.globalAlpha=.8-s.h*.5;
    ctx.fillStyle=s.h<.25?'#ffe9ff':(s.h<.6?'#c7a6ff':'#7fc8ff');
    ctx.fillRect(x,y,s.r,s.r);
  }
  ctx.restore(); ctx.globalAlpha=1;
  // ดาวพื้นหลัง
  for(const s of stars){
    s.x-=s.z*.08*(1+boost*30); if(s.x<0)s.x=W;
    const tw=.55+.45*Math.sin(t*.03+s.p);
    ctx.globalAlpha=tw*s.z; ctx.fillStyle=s.c;
    ctx.beginPath(); ctx.arc(s.x+px*s.z*24,s.y+py*s.z*24,s.r*s.z+.2,0,6.283); ctx.fill();
  }
  ctx.globalAlpha=1;
  // ดาวตก
  if(--nextShoot<=0){
    nextShoot=120+Math.random()*220;
    shoots.push({x:Math.random()*W*.9+W*.1,y:Math.random()*H*.4,l:0});
  }
  shoots=shoots.filter(s=>s.l<1);
  for(const s of shoots){
    s.l+=.025; const x=s.x-s.l*W*.35, y=s.y+s.l*H*.28;
    const gr=ctx.createLinearGradient(x,y,x+90,y-70);
    gr.addColorStop(0,'rgba(255,255,255,'+(1-s.l)+')'); gr.addColorStop(1,'rgba(255,255,255,0)');
    ctx.strokeStyle=gr; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+90,y-70); ctx.stroke();
  }
  // เอฟเฟกต์ฉลอง (หัวใจ + ดาว)
  bursts=bursts.filter(p=>p.a>0);
  for(const p of bursts){
    p.vy+=.06; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.a-=.007;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.globalAlpha=Math.max(p.a,0);
    ctx.fillStyle=p.c; ctx.shadowColor=p.c; ctx.shadowBlur=12;
    p.star?star(p.s):heart(p.s); ctx.restore();
  }
  ctx.globalAlpha=1; boost*=.97;
  requestAnimationFrame(draw);
}
function heart(s){
  ctx.beginPath(); ctx.moveTo(0,s*.3);
  ctx.bezierCurveTo(0,-s*.1,-s*.6,-s*.1,-s*.6,s*.25); ctx.bezierCurveTo(-s*.6,s*.6,0,s*.8,0,s);
  ctx.bezierCurveTo(0,s*.8,s*.6,s*.6,s*.6,s*.25); ctx.bezierCurveTo(s*.6,-s*.1,0,-s*.1,0,s*.3); ctx.fill();
}
function star(s){
  ctx.beginPath();
  for(let i=0;i<10;i++){const r=i%2?s*.25:s*.6,a=i*Math.PI/5-Math.PI/2;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}
  ctx.closePath(); ctx.fill();
}
const BC=['#ff6ec7','#ffd6f3','#b79cff','#7fd8ff','#fff3a8','#ffffff'];
function burst(x,y,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283, sp=2+Math.random()*7;
    bursts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,s:9+Math.random()*14,rot:Math.random()*6,
      vr:(Math.random()-.5)*.15,c:BC[(Math.random()*BC.length)|0],a:1,star:Math.random()<.4});
  }
}
draw();

/* ===== ลำดับหน้า ===== */
const $=id=>document.getElementById(id);$('start').addEventListener('click',()=>{
  $('intro').classList.add('hide');$('story').classList.remove('hide'); boost=.5;
  let i=0;
  (function next(){
    if(i>=LINES.length){ $('story').classList.add('hide');$('ask').classList.remove('hide'); return; }
    const el=$('line'); el.style.animation='none'; void el.offsetWidth;
    el.textContent=LINES[i++]; el.style.animation='';
    setTimeout(next,3200);
  })();
});

/* ===== ปุ่ม "ไม่ตกลง" วิ่งหนี (อยู่ในขอบเขตหน้าจอ) ===== */
const noBtn=$('no'), yesBtn=$('yes'); let ph=null, fled=false; const M=14;
const hit=(a,b,p)=>!(a.right+p<b.left||a.left-p>b.right||a.bottom+p<b.top||a.top-p>b.bottom);
function flee(){
  const w=noBtn.offsetWidth,h=noBtn.offsetHeight;
  if(!fled){
    const r=noBtn.getBoundingClientRect();
    ph=document.createElement('span'); ph.style.cssText=`display:inline-block;width:${w}px;height:${h}px`;
    noBtn.before(ph); noBtn.classList.add('fleeing');
    noBtn.style.left=r.left+'px'; noBtn.style.top=r.top+'px'; fled=true; void noBtn.offsetWidth;
  }
  const maxX=Math.max(M,innerWidth-w-M), maxY=Math.max(M,innerHeight-h-M);
  const cur=noBtn.getBoundingClientRect(), yes=yesBtn.getBoundingClientRect(); let x,y;
  for(let i=0;i<30;i++){
    x=M+Math.random()*(maxX-M); y=M+Math.random()*(maxY-M);
    const far=Math.hypot(x-cur.left,y-cur.top)>Math.min(innerWidth,innerHeight)*.25;
    if(far&&!hit({left:x,top:y,right:x+w,bottom:y+h},yes,16))break;
  }
  noBtn.style.left=x+'px'; noBtn.style.top=y+'px';
}
['pointerenter','touchstart','pointerdown','focus'].forEach(ev=>
  noBtn.addEventListener(ev,e=>{if(e.cancelable)e.preventDefault();flee()},{passive:false}));
noBtn.addEventListener('click',e=>{e.preventDefault();flee()});
addEventListener('resize',()=>{
  if(!fled)return; const r=noBtn.getBoundingClientRect();
  noBtn.style.left=Math.min(Math.max(M,r.left),innerWidth-r.width-M)+'px';
  noBtn.style.top=Math.min(Math.max(M,r.top),innerHeight-r.height-M)+'px';
});

/* ===== กดตกลง ===== */
yesBtn.addEventListener('click',()=>{
  // เปลี่ยนรูปภาพเมื่อกดตกลง (ถ้ามีไฟล์ happy.jpg สามารถเปลี่ยนได้ที่ตัวแปร YES ด้านบน)
  if(YES.image) document.getElementById('emoji').src = YES.image;
  $('title').textContent = YES.title; 
  $('text').innerHTML = YES.text;
  $('btns').classList.add('hide'); noBtn.classList.add('hide'); if(ph)ph.remove();
  boost=1;
  [[.1,.2],[.9,.2],[.5,.12],[.15,.8],[.85,.8],[.5,.5],[.3,.4],[.7,.4]]
    .forEach((p,i)=>setTimeout(()=>burst(W*p[0],H*p[1],50),i*200));
  const rain=setInterval(()=>{for(let i=0;i<3;i++)bursts.push({x:Math.random()*W,y:-20,vx:(Math.random()-.5)*2,vy:1+Math.random()*2,
    s:9+Math.random()*12,rot:0,vr:.05,c:BC[(Math.random()*BC.length)|0],a:1.2,star:Math.random()<.4})},100);
  setTimeout(()=>clearInterval(rain),6000);
});
</script>
</body>
</html>
